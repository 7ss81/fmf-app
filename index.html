<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FMF">
<meta name="theme-color" content="#1b1f2a">
<title>FMF</title>
<style>
:root{--bg:#1b1f2a;--card:#272c3a;--line:#323849;--me:#2f7d6d;--tx:#f1efe9;--mu:#9aa0b2;--ac:#e2b36b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.55 "IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:10px 14px;font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
button:disabled{opacity:.5}
.go{background:var(--ac);color:#241b08;font-weight:600}
header{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
header button{flex:1}
header button.on{background:var(--me)}
main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.b{max-width:82%;padding:8px 12px;border-radius:18px;background:var(--card);overflow-wrap:anywhere}
.b.me{align-self:flex-start;background:var(--me)}
.b.ot{align-self:flex-end}
.b img,.b video,.post img,.post video{max-width:100%;max-height:60vh;border-radius:12px;display:block}
.b p+img,.b p+video{margin-top:6px}
.b img+p,.b video+p{margin-top:6px}
.post{background:var(--card);border-radius:18px;padding:10px}
.post p{margin-top:8px}
.empty{margin:auto;color:var(--mu);text-align:center}
footer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
input[type=text],input[type=email],input[type=password]{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit}
#login{margin:auto;display:flex;flex-direction:column;gap:10px;width:min(320px,90%)}
#login h1{font-size:2rem;text-align:center;margin-bottom:6px}
#err{color:#f08a8a;min-height:1.5em;text-align:center}
.hide{display:none!important}
#app{display:contents}
</style>
</head>
<body>

<div id="login" class="hide">
  <h1>FMF</h1>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username" dir="ltr">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" dir="ltr">
  <button class="go" id="in">دخول</button>
  <div id="err"></div>
</div>

<div id="app" class="hide">
  <header>
    <button id="t1" class="on">💬 الرسائل</button>
    <button id="t2">🎬 المقاطع</button>
    <button id="out" aria-label="خروج" style="flex:0 0 auto">خروج</button>
  </header>
  <main id="list"></main>
  <footer>
    <button id="at" aria-label="إرفاق">📎</button>
    <input id="txt" type="text" placeholder="اكتب رسالة" enterkeyhint="send">
    <button class="go" id="send">إرسال</button>
    <input id="file" type="file" accept="image/*,video/*" class="hide">
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://zioubnredtkduprxkeyn.supabase.co';
const SB_KEY='sb_publishable_63u_TTo-1xKvyRlV60dblQ_YIik0dTW';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
let me=null,tab='messages',seen=new Set(),cache={},live=false;

async function sign(p){
  if(cache[p])return cache[p];
  const {data}=await sb.storage.from('media').createSignedUrl(p,86400);
  return cache[p]=data&&data.signedUrl;
}

async function node(r){
  const d=document.createElement('div');
  d.className=tab==='messages'?'b '+(r.user_id===me?'me':'ot'):'post';
  if(r.media_path){
    const v=r.media_type==='video';
    const e=document.createElement(v?'video':'img');
    if(v){e.controls=true;e.playsInline=true;e.preload='metadata'}
    e.src=await sign(r.media_path);
    d.append(e);
  }
  const t=tab==='messages'?r.body:r.caption;
  if(t){const p=document.createElement('p');p.textContent=t;d.append(p)}
  return d;
}

async function load(){
  const L=$('#list');L.textContent='';seen.clear();
  const {data,error}=await sb.from(tab).select('*').order('created_at',{ascending:false}).limit(60);
  if(error){L.innerHTML='<div class="empty">ما قدرت أحمّل. تأكد من تشغيل ملف SQL.</div>';return}
  const rows=data||[];
  if(tab==='messages')rows.reverse();
  if(!rows.length){L.innerHTML='<div class="empty">'+(tab==='messages'?'ما فيه رسائل بعد. ابدأ المحادثة.':'ما فيه مقاطع بعد. انشر أول مقطع.')+'</div>';return}
  const ns=await Promise.all(rows.map(node));
  rows.forEach(r=>seen.add(tab+r.id));
  L.append(...ns);
  if(tab==='messages')L.scrollTop=L.scrollHeight;
}

async function add(r){
  const k=tab+r.id;if(seen.has(k))return;seen.add(k);
  const L=$('#list');const em=L.querySelector('.empty');if(em)em.remove();
  const n=await node(r);
  if(tab==='messages'){L.append(n);L.scrollTop=L.scrollHeight}else L.prepend(n);
}

function go(t){
  tab=t;
  $('#t1').classList.toggle('on',t==='messages');
  $('#t2').classList.toggle('on',t==='posts');
  $('#txt').placeholder=t==='messages'?'اكتب رسالة':'اكتب وصف للمقطع (اختياري)';
  load();
}

async function send(){
  const txt=$('#txt').value.trim(),f=$('#file').files[0];
  if(!txt&&!f)return;
  if(tab==='posts'&&!f){alert('اختر صورة أو فيديو أول');return}
  $('#send').disabled=true;
  try{
    let path=null,type=null;
    if(f){
      const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      path=me+'/'+Date.now()+'.'+ext;
      const {error}=await sb.storage.from('media').upload(path,f,{contentType:f.type});
      if(error)throw error;
      type=f.type.startsWith('video')?'video':'image';
    }
    const row=tab==='messages'?{body:txt||null,media_path:path,media_type:type}:{caption:txt||null,media_path:path,media_type:type};
    const {data,error}=await sb.from(tab).insert(row).select().single();
    if(error)throw error;
    await add(data);
    $('#txt').value='';$('#file').value='';$('#at').textContent='📎';
  }catch(e){alert('ما انرسل: '+e.message)}
  $('#send').disabled=false;
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  me=session?session.user.id:null;
  $('#login').classList.toggle('hide',!!me);
  $('#app').classList.toggle('hide',!me);
  if(!me)return;
  go('messages');
  if(!live){
    live=true;
    sb.channel('live').on('postgres_changes',{event:'INSERT',schema:'public'},p=>{if(p.table===tab)add(p.new)}).subscribe();
  }
}

$('#in').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  $('#err').textContent=error?(error.status===400?'الإيميل أو كلمة السر غلط':'تعذر الاتصال: '+error.message):'';
  if(!error)boot();
};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#t1').onclick=()=>go('messages');
$('#t2').onclick=()=>go('posts');
$('#at').onclick=()=>$('#file').click();
$('#file').onchange=()=>{$('#at').textContent=$('#file').files[0]?'✅':'📎'};
$('#send').onclick=send;
$('#txt').onkeydown=e=>{if(e.key==='Enter')send()};
boot();
</script>
</body>
</html>
